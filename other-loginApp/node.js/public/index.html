<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/login.css" />
    <script src="a_js/login.js" defer></script>
    <title>login</title>
  </head>

  <body>
    <header>
      <h1>OfficialSupportSystem</h1>
    </header>

    <main>
      <section>
        <h2>サインイン</h2>
        <p>このシステムを利用する際は必ずサインインしてください。</p>
      </section>

      <form name="base" method="post" id="myForm">
        <section>
          <label for="player">利用者ＩＤ*： </label>
          <input
            id="player"
            name="player"
            type="text"
            max="20"
            required
          /><br />
          <small>個人を特定できるものは避けましょう。</small>
        </section>

        <section>
          <label for="pass"> PASSWORD*: </label>
          <input
            type="password"
            id="pass"
            name="pass"
            minlength="8"
            maxlength="30"
            required
          />
          <br />
          <small id="passError"></small>
        </section>

        <section>
          <input type="submit" value="送信" id="submitBtn" disabled />
        </section>
      </form>

      <small
        >もしかして、登録がまだですか？ <br />
        その場合は
        <a href="regist.html">こちらをクリックしてください。</a>
      </small>
    </main>
  </body>
</html>
