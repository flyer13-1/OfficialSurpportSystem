<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/regist.css" />
    <script src="a_js/regist.js"></script>
    <title>アカウント登録</title>
  </head>
  <body>
    <header>
      <h1>OfficialSupportSystem</h1>
    </header>

    <main>
      <h2>アカウント登録</h2>
      <form name="myForm" method="post" id="myForm">
        <section id="userId">
          <label for="player">利用者ＩＤ*：</label>
          <input id="player" type="text" max="20" required /><br />
          <small
            >個人情報（本名など）は書かないでください。
            もし被りがあった場合は別の利用者IDを設定してください。
          </small>
        </section>

        <section id="name">
          <label for="nickname">ニックネーム*:</label>
          <input type="text" name="nickname" id="nickname" required />
          <br />
          <small>
            個人情報（本名など）は書かないでください。
            必ず管理者がわかるような名前にしてほしいです。
          </small>
        </section>

        <section id="PWD">
          <label for="pass">PASSWORD*:</label>
          <input
            type="password"
            id="pass"
            minlength="8"
            maxlength="30"
            required
          /><br />

          <small id="passError"></small>
        </section>

        <section>
          <label for="submitBtn">
            <input type="submit" value="送信" id="submitBtn" disabled />
          </label>
        </section>
      </form>
    </main>
  </body>
</html>
