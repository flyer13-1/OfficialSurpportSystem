AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OfficialSupportSystem - AWS SAM Backend

# ===== Parameters =====
Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]

# ===== Globals =====
# PoliciesはGlobalsに書けないため削除。各FunctionはRoleで権限を付与する
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        # ログイン認証は Cognito User Pool が担う（Lambda Authorizer が
        # ID トークンを JWKS で検証する。authorizer.mjs 参照）。
        COGNITO_USER_POOL_ID: "ap-northeast-1_CieJXqC9H"
        COGNITO_CLIENT_ID: "404fhgre43fnt3pbb7bfv2c33v"

        USERS_TABLE: !Ref UsersTable
        ORGANIZATIONS_TABLE: !Ref OrganizationsTable
        RACE_TABLE: !Ref RaceTable
        ENTRY_TABLE: !Ref EntryTable
        START_DRIVER_TABLE: !Ref StartDriverTable
        PIT_ASSIGNMENT_TABLE: !Ref PitAssignmentTable
        PIT_LOG_TABLE: !Ref PitLogTable
        PIT_LOG_HISTORY_TABLE: !Ref PitLogHistoryTable
        RETIRE_TABLE: !Ref RetireTable
        OUTPOST_LOG_TABLE: !Ref OutpostLogTable

Resources:
  # ===== IAM Role =====
  # 全Lambda共通で使うIAMロール。DynamoDB全操作とSSMパラメータ取得を許可
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OfficialSupportSystem-${Env}-LambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logsへの書き込みを許可（Lambda基本実行ロール）
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBCrudPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource: "*" # 全テーブルを許可（後で絞り込み可）

  # ===== Lambda Layer（共通処理）=====
  # dynamodb.js / generateId / responseヘルパーなどを格納
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "OfficialSupportSystem-${Env}-CommonLayer"
      ContentUri: layers/common/
      CompatibleRuntimes: [nodejs22.x]
      RetentionPolicy: Delete

  # ===== API Gateway =====
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "OfficialSupportSystem-${Env}-Api"
      StageName: !Ref Env
      # CORS設定: ブラウザからのクロスオリジンリクエストを許可
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      # 認証設定
      # DefaultAuthorizer は指定しない＝既定は認証なし。
      # 認証が必要なメソッドだけが個別に Auth: Authorizer: LambdaAuthorizer を指定する。
      Auth:
        Authorizers:
          LambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            # TOKEN authorizer: Authorization ヘッダーの Bearer トークンを検証する
            Identity:
              Header: Authorization

  # ===== Lambda Authorizer =====
  # JWTを検証してAllow/DenyのIAMポリシーを返す
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Authorizer"
      CodeUri: functions/auth/
      Handler: authorizer.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  # ===== Phase 2: 認証・ユーザー管理 API =====
  # ログイン（POST /login）は廃止。フロントは Cognito User Pool に直接認証する
  # （common.js の cognitoPool → authenticateUser）。Lambda Authorizer が
  # Cognito の ID トークンを検証する（authorizer.mjs）。

  # POST /user — ユーザー登録（認証不要・Cognito signUp/confirm後に呼ぶ）
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Register"
      CodeUri: functions/auth/
      Handler: register.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user
            Method: POST

  # POST /user/me — 大会ID照会（認証必要）
  ConformFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Conform"
      CodeUri: functions/auth/
      Handler: conform.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/me
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /user/me — プロフィール取得（認証必要）
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Profile"
      CodeUri: functions/auth/
      Handler: profile.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/me
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /user/password は廃止。パスワード再設定は Cognito の
  # forgotPassword / confirmPassword をフロントから直接呼ぶ（forgetPass.js）。

  # ===== Phase 3: コア API =====

  # POST /entry/bulk — エントリー一括登録（認証必要）
  BulkEntryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-BulkEntry"
      CodeUri: functions/entry/
      Handler: bulkEntry.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entry/bulk
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entry/start-driver/bulk — スタートドライバー一括登録（認証必要）
  BulkStartDriverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-BulkStartDriver"
      CodeUri: functions/entry/
      Handler: bulkStartDriver.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entry/start-driver/bulk
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/init — 初期データ取得（認証必要）
  InitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Init"
      CodeUri: functions/entry/
      Handler: init.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/init
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/auto — 自動入力送信（認証必要）
  AutoCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-AutoCreate"
      CodeUri: functions/pitlog/
      Handler: autoCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/auto
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/hand — 手入力送信（認証必要）
  HandCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-HandCreate"
      CodeUri: functions/pitlog/
      Handler: handCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/hand
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/update — 変更対象ピット記録取得（認証必要）
  UpdateGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-UpdateGet"
      CodeUri: functions/pitlog/
      Handler: updateGet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/update
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /entries/update — 記録変更/リタイア登録（認証必要）
  UpdatePutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-UpdatePut"
      CodeUri: functions/pitlog/
      Handler: updatePut.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/update
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/retire — リタイア情報取得（認証必要）
  RetireGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RetireGet"
      CodeUri: functions/pitlog/
      Handler: retireGet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/retire
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/retire — リタイア登録（認証必要）
  RetireCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RetireCreate"
      CodeUri: functions/pitlog/
      Handler: retireCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/retire
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/show — 全ピット情報取得（認証必要）
  ShowAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-ShowAll"
      CodeUri: functions/pitlog/
      Handler: showAll.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/show
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # ===== 管理者画面（一次情報CRUD）: race =====
  # IF設計書: doc/IF/admin/race.md ／ 認可は requireAdmin（layer admin.js）で admin 限定

  # GET /race — レース一覧（認証必要・admin）
  RaceListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceList"
      CodeUri: functions/race/
      Handler: list.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /race
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /race — レース登録（認証必要・admin）
  RaceCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceCreate"
      CodeUri: functions/race/
      Handler: create.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /race
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /race — レース変更（認証必要・admin）
  RaceUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceUpdate"
      CodeUri: functions/race/
      Handler: update.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /race
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # DELETE /race/{id} — レース削除（認証必要・admin）
  RaceDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceDelete"
      CodeUri: functions/race/
      Handler: delete.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /race/{id}
            Method: DELETE
            Auth:
              Authorizer: LambdaAuthorizer

  # ===== Phase 1: DynamoDB テーブル =====

  # ユーザーテーブル: PK=cognito_sub
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cognito_sub
          AttributeType: S
      KeySchema:
        - AttributeName: cognito_sub
          KeyType: HASH

  # 組織テーブル: PK=circuit（サーキット番号）
  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Organizations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: circuit
          AttributeType: N
      KeySchema:
        - AttributeName: circuit
          KeyType: HASH

  # レーステーブル: PK=id
  RaceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Race"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # エントリーテーブル: PK=race_id, SK=car_num
  EntryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Entry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # スタートドライバーテーブル: PK=race_id, SK=car_num
  StartDriverTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-StartDriver"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # ピット担当テーブル: PK=race_id, SK=username#maintenance_area / GSI=UsernameIndex
  PitAssignmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitAssignment"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: "username#maintenance_area"
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: maintenance_area
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: "username#maintenance_area"
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
            - AttributeName: maintenance_area
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ピットログテーブル: PK=race_id, SK=id(ULID)
  # GSI なし（car_num での絞り込みは race_id パーティション内のフィルタで対応）
  PitLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # ピットログ変更履歴テーブル: PK=pit_log_id, SK=id / GSI=modified_by
  PitLogHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitLogHistory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pit_log_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: modified_by
          AttributeType: S
        - AttributeName: modified_at
          AttributeType: S
      KeySchema:
        - AttributeName: pit_log_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ModifiedByIndex
          KeySchema:
            - AttributeName: modified_by
              KeyType: HASH
            - AttributeName: modified_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # リタイアテーブル: PK=race_id, SK=car_num
  RetireTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Retire"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # 外回り記録テーブル: PK=race_id, SK=id(ULID) / GSI=username+created_at
  OutpostLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-OutpostLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

# ===== Outputs =====
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Env}/"
  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
