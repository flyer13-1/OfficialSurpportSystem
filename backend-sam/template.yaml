AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OfficialSupportSystem - AWS SAM Backend

# ===== Parameters =====
Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]

# ===== Globals =====
# PoliciesはGlobalsに書けないため削除。各FunctionはRoleで権限を付与する
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        # ログイン認証は Cognito User Pool が担う（Lambda Authorizer が
        # ID トークンを JWKS で検証する。authorizer.mjs 参照）。
        COGNITO_USER_POOL_ID: "ap-northeast-1_tGblsfFgk"
        COGNITO_CLIENT_ID: "6lh05mp69vfns3cfpj6hls4e7i"

        # raceId トークンの署名鍵（値は SSM に置く。ここは名前だけ。doc/IF/raceIdToken.md §6）
        RACE_TOKEN_SECRET_PARAM: !Sub "/OfficialSupportSystem/dev/race-token-secret"

        USERS_TABLE: !Ref UsersTable
        ORGANIZATIONS_TABLE: !Ref OrganizationsTable
        RACE_TABLE: !Ref RaceTable
        ENTRY_TABLE: !Ref EntryTable
        START_DRIVER_TABLE: !Ref StartDriverTable
        PIT_ASSIGNMENT_TABLE: !Ref PitAssignmentTable
        PIT_LOG_TABLE: !Ref PitLogTable
        PIT_LOG_HISTORY_TABLE: !Ref PitLogHistoryTable
        RETIRE_TABLE: !Ref RetireTable
        OUTPOST_LOG_TABLE: !Ref OutpostLogTable

Resources:
  # ===== IAM Role =====
  # 全Lambda共通で使うIAMロール。DynamoDB全操作とSSMパラメータ取得を許可
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OfficialSupportSystem-${Env}-LambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logsへの書き込みを許可（Lambda基本実行ロール）
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBCrudPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource: "*" # 全テーブルを許可（後で絞り込み可）

  # regist（POST /user）専用ロール。Users・Organizationsテーブルのみ許可
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OfficialSupportSystem-${Env}-AuthLambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RegisterDynamoDBPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt OrganizationsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: !GetAtt UsersTable.Arn

  # conform（POST /user/me・大会ID照会）専用ロール。RaceTableの参照(Scan)と、
  # raceId トークン署名鍵（SSM）の読み取りを許可（doc/IF/raceIdToken.md §6）
  ConformLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OfficialSupportSystem-${Env}-ConformLambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConformRaceReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub "${RaceTable.Arn}/index/TodayIdIndex"
        - PolicyName: RaceTokenSecretReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/OfficialSupportSystem/dev/race-token-secret"

  # profile（GET /user/me・プロフィール取得）専用ロール。UsersTableの参照(GetItem)のみ許可
  ProfileLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OfficialSupportSystem-${Env}-ProfileLambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ProfileUserReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt UsersTable.Arn

  # race / entry / start_driver 関連（管理者向け・一般向け共通）の専用ロール。
  # RaceTable・EntryTable・StartDriverTable・PitAssignmentTable・PitLogTable のみ許可。
  # 複数の関数が同じテーブル群にまたがってアクセスするため、関数ごとに分けると
  # ほぼ同じポリシーの重複が大量に増える。1ロールにまとめて共有する。
  RaceDataLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OfficialSupportSystem-${Env}-RaceDataLambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RaceDataCrudPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt RaceTable.Arn
                  - !Sub "${RaceTable.Arn}/index/*"
                  - !GetAtt EntryTable.Arn
                  - !GetAtt StartDriverTable.Arn
                  - !GetAtt PitAssignmentTable.Arn
                  - !Sub "${PitAssignmentTable.Arn}/index/*"
                  - !GetAtt PitLogTable.Arn
              # pit_assignment登録時の「登録済み利用者か」の確認用（§4.2）。
              # UsersTable本体ではなくUsernameIndexの参照のみに限定する。
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub "${UsersTable.Arn}/index/UsernameIndex"
              # requireAdmin が UsersTable を cognito_sub で引いて所属サーキットを取得する（全管理者API）。
              # GET /admin/race/data（§1.2）で users 一覧を返すための読み取り専用アクセス。
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt UsersTable.Arn

  # ===== Lambda Layer（共通処理）=====
  # dynamodb.js / generateId / responseヘルパーなどを格納
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "OfficialSupportSystem-${Env}-CommonLayer"
      ContentUri: layers/common/
      CompatibleRuntimes: [nodejs22.x]
      RetentionPolicy: Delete

  # ===== API Gateway =====
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "OfficialSupportSystem-${Env}-Api"
      StageName: !Ref Env
      # CORS設定: ブラウザからのクロスオリジンリクエストを許可
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Race-Id'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      # 認証設定
      # DefaultAuthorizer は指定しない＝既定は認証なし。
      # 認証が必要なメソッドだけが個別に Auth: Authorizer: LambdaAuthorizer を指定する。
      Auth:
        Authorizers:
          LambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            # TOKEN authorizer: Authorization ヘッダーの Bearer トークンを検証する
            Identity:
              Header: Authorization

  # ===== Lambda Authorizer =====
  # JWTを検証してAllow/DenyのIAMポリシーを返す
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Authorizer"
      CodeUri: functions/auth/
      Handler: authorizer.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  # ===== Phase 2: 認証・ユーザー管理 API =====
  # ログイン（POST /login）は廃止。フロントは Cognito User Pool に直接認証する
  # （common.js の cognitoPool → authenticateUser）。Lambda Authorizer が
  # Cognito の ID トークンを検証する（authorizer.mjs）。

  # GET /user/check — 担当者名の空き確認（認証不要・Cognito signUp前に呼ぶ）
  CheckUsernameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-CheckUsername"
      CodeUri: functions/auth/
      Handler: checkUsername.handler
      Role: !GetAtt AuthLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/check
            Method: GET

  # POST /user — ユーザー登録（認証不要・Cognito signUp/confirm後に呼ぶ）
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Register"
      CodeUri: functions/auth/
      Handler: register.handler
      Role: !GetAtt AuthLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user
            Method: POST

  # POST /user/me — 大会ID照会（認証必要）
  ConformFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Conform"
      CodeUri: functions/auth/
      Handler: conform.handler
      Role: !GetAtt ConformLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/me
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /user/me — プロフィール取得（認証必要）
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Profile"
      CodeUri: functions/auth/
      Handler: profile.handler
      Role: !GetAtt ProfileLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/me
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /user/password は廃止。パスワード再設定は Cognito の
  # forgotPassword / confirmPassword をフロントから直接呼ぶ（forgetPass.js）。

  # ===== Phase 3: コア API =====

  # POST /admin/entry/bulk — エントリー一括登録（認証必要）
  BulkEntryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-BulkEntry"
      CodeUri: functions/admin/
      Handler: entryBulk.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/entry/bulk
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /admin/entry — エントリー変更（認証必要）
  EntryUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-EntryUpdate"
      CodeUri: functions/admin/
      Handler: entryUpdate.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/entry
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # DELETE /admin/entry/{carNum} — エントリー削除（認証必要）
  EntryDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-EntryDelete"
      CodeUri: functions/admin/
      Handler: entryDelete.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/entry/{carNum}
            Method: DELETE
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /admin/start-driver/bulk — スタートドライバー一括登録（認証必要）
  BulkStartDriverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-BulkStartDriver"
      CodeUri: functions/admin/
      Handler: startDriverBulk.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/start-driver/bulk
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /admin/start-driver — スタートドライバー変更（認証必要）
  StartDriverUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-StartDriverUpdate"
      CodeUri: functions/admin/
      Handler: startDriverUpdate.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/start-driver
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # DELETE /admin/start-driver/{carNum} — スタートドライバー削除（認証必要）
  StartDriverDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-StartDriverDelete"
      CodeUri: functions/admin/
      Handler: startDriverDelete.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/start-driver/{carNum}
            Method: DELETE
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /admin/pit-assignment/bulk — 担当割り当て一括登録（認証必要）
  BulkPitAssignmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-BulkPitAssignment"
      CodeUri: functions/admin/
      Handler: pitAssignmentBulk.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/pit-assignment/bulk
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /admin/pit-assignment — 担当割り当て変更（認証必要）
  PitAssignmentUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-PitAssignmentUpdate"
      CodeUri: functions/admin/
      Handler: pitAssignmentUpdate.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/pit-assignment
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # DELETE /admin/pit-assignment — 担当割り当て削除（認証必要）
  PitAssignmentDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-PitAssignmentDelete"
      CodeUri: functions/admin/
      Handler: pitAssignmentDelete.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/pit-assignment
            Method: DELETE
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /admin/race/data — entry/start_driver/pit_assignment/users 統合一覧（認証必要）
  ShowDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-ShowData"
      CodeUri: functions/admin/
      Handler: showData.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/race/data
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/init — 初期データ取得（認証必要）
  InitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Init"
      CodeUri: functions/entry/
      Handler: init.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/init
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/start-driver — スタートドライバー登録（一般利用者向け・認証必要）
  StartDriverCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-StartDriverCreate"
      CodeUri: functions/entry/
      Handler: startDriverCreate.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/start-driver
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/auto — 自動入力送信（認証必要）
  AutoCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-AutoCreate"
      CodeUri: functions/pitlog/
      Handler: autoCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/auto
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/hand — 手入力送信（認証必要）
  HandCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-HandCreate"
      CodeUri: functions/pitlog/
      Handler: handCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/hand
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/update — 変更対象ピット記録取得（認証必要）
  UpdateGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-UpdateGet"
      CodeUri: functions/pitlog/
      Handler: updateGet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/update
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /entries/update — 記録変更/リタイア登録（認証必要）
  UpdatePutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-UpdatePut"
      CodeUri: functions/pitlog/
      Handler: updatePut.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/update
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/retire — リタイア情報取得（認証必要）
  RetireGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RetireGet"
      CodeUri: functions/pitlog/
      Handler: retireGet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/retire
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/retire — リタイア登録（認証必要）
  RetireCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RetireCreate"
      CodeUri: functions/pitlog/
      Handler: retireCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/retire
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/show — 全ピット情報取得（認証必要）
  ShowAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-ShowAll"
      CodeUri: functions/pitlog/
      Handler: showAll.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/show
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # ===== 管理者画面（一次情報CRUD）: race =====
  # IF設計書: doc/aws-sam/admin/v2/02_race.md ／ 認可は requireAdmin（layer admin.js）で admin 限定

  # GET /admin/race — レース一覧（認証必要・admin）
  RaceListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceList"
      CodeUri: functions/admin/
      Handler: raceList.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/race
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /admin/race — レース登録（認証必要・admin）
  RaceCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceCreate"
      CodeUri: functions/admin/
      Handler: raceCreate.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/race
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /admin/race — レース変更（認証必要・admin）
  RaceUpdateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceUpdate"
      CodeUri: functions/admin/
      Handler: raceUpdate.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/race
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # DELETE /admin/race/{id} — レース削除（認証必要・admin）
  RaceDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RaceDelete"
      CodeUri: functions/admin/
      Handler: raceDelete.handler
      Role: !GetAtt RaceDataLambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/race/{id}
            Method: DELETE
            Auth:
              Authorizer: LambdaAuthorizer

  # ===== Phase 1: DynamoDB テーブル =====

  # ユーザーテーブル: PK=cognito_sub
  # UsersTable: PK=cognito_sub。GSI=UsernameIndex（pit_assignment登録時の
  # 「登録済み利用者か」の確認用。doc/aws-sam/admin/v2/03_race_data.md §4.2）
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cognito_sub
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: cognito_sub
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY

  # 組織テーブル: PK=circuit（サーキット番号）
  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Organizations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: circuit
          AttributeType: N
      KeySchema:
        - AttributeName: circuit
          KeyType: HASH

  # レーステーブル: PK=id
  # RaceTable: PK=id。GSI=OrganizationIndex（自分のサーキットの一覧・title重複確認）、
  # TodayIdIndex（conformの大会ID照合・todayId重複確認）。doc/aws-sam/admin/v2/02_race.md §1
  RaceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Race"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: organization_id
          AttributeType: N
        - AttributeName: finish_date
          AttributeType: S
        - AttributeName: today_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OrganizationIndex
          KeySchema:
            - AttributeName: organization_id
              KeyType: HASH
            - AttributeName: finish_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TodayIdIndex
          KeySchema:
            - AttributeName: today_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # エントリーテーブル: PK=race_id, SK=car_num
  EntryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Entry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # スタートドライバーテーブル: PK=race_id, SK=car_num
  StartDriverTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-StartDriver"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # ピット担当テーブル: PK=race_id, SK=username#maintenance_area / GSI=UsernameIndex
  PitAssignmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitAssignment"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: "username#maintenance_area"
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: maintenance_area
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: "username#maintenance_area"
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
            - AttributeName: maintenance_area
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ピットログテーブル: PK=race_id, SK=id(ULID)
  # GSI なし（car_num での絞り込みは race_id パーティション内のフィルタで対応）
  PitLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # ピットログ変更履歴テーブル: PK=pit_log_id, SK=id / GSI=modified_by
  PitLogHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitLogHistory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pit_log_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: modified_by
          AttributeType: S
        - AttributeName: modified_at
          AttributeType: S
      KeySchema:
        - AttributeName: pit_log_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ModifiedByIndex
          KeySchema:
            - AttributeName: modified_by
              KeyType: HASH
            - AttributeName: modified_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # リタイアテーブル: PK=race_id, SK=car_num
  RetireTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Retire"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # 外回り記録テーブル: PK=race_id, SK=id(ULID) / GSI=username+created_at
  OutpostLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-OutpostLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

# ===== Outputs =====
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Env}/"
  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
