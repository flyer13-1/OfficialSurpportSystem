AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OfficialSupportSystem - AWS SAM Backend

# ===== Parameters =====
Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, stg, prod]

# ===== Globals =====
# PoliciesはGlobalsに書けないため削除。各FunctionはRoleで権限を付与する
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        ENV: !Ref Env
        JWT_SECRET: !Sub "{{resolve:ssm:/OfficialSupportSystem/${Env}/JWT_SECRET}}"
        USERS_TABLE: !Ref UsersTable
        ORGANIZATIONS_TABLE: !Ref OrganizationsTable
        RACE_TABLE: !Ref RaceTable
        ENTRY_TABLE: !Ref EntryTable
        START_DRIVER_TABLE: !Ref StartDriverTable
        PIT_ASSIGNMENT_TABLE: !Ref PitAssignmentTable
        PIT_LOG_TABLE: !Ref PitLogTable
        PIT_LOG_HISTORY_TABLE: !Ref PitLogHistoryTable
        RETIRE_TABLE: !Ref RetireTable
        OUTPOST_LOG_TABLE: !Ref OutpostLogTable

Resources:
  # ===== IAM Role =====
  # 全Lambda共通で使うIAMロール。DynamoDB全操作とSSMパラメータ取得を許可
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "OfficialSupportSystem-${Env}-LambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logsへの書き込みを許可（Lambda基本実行ロール）
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBCrudPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource: "*" # 全テーブルを許可（後で絞り込み可）
        - PolicyName: SSMParameterPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/OfficialSupportSystem/*"

  # ===== Lambda Layer（共通処理）=====
  # dynamodb.js / generateId / responseヘルパーなどを格納
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "OfficialSupportSystem-${Env}-CommonLayer"
      ContentUri: layers/common/
      CompatibleRuntimes: [nodejs22.x]
      RetentionPolicy: Delete

  # ===== API Gateway =====
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "OfficialSupportSystem-${Env}-Api"
      StageName: !Ref Env
      # CORS設定: ブラウザからのクロスオリジンリクエストを許可
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      # 認証設定
      Auth:
        DefaultAuthorizer: LambdaAuthorizer # デフォルトはJWT認証必須
        AddDefaultAuthorizerToCorsPreflight: false # OPTIONSは認証不要（これがないとCORSが弾かれる）
        Authorizers:
          LambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Headers: [Authorization] # JWTはAuthorizationヘッダーで受け取る
            AuthorizerPayloadFormatVersion: "1.0"
            EnableSimpleResponses: false

  # ===== Lambda Authorizer =====
  # JWTを検証してAllow/DenyのIAMポリシーを返す
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Authorizer"
      CodeUri: functions/auth/
      Handler: authorizer.handler
      Role: !GetAtt LambdaExecutionRole.Arn

  # ===== Phase 2: 認証・ユーザー管理 API =====

  # POST /login — ログイン（認証不要）
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Login"
      CodeUri: functions/auth/
      Handler: login.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /login
            Method: POST
            Auth:
              Authorizer: NONE # 認証不要

  # POST /user — ユーザー登録（認証不要）
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Register"
      CodeUri: functions/auth/
      Handler: register.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user
            Method: POST
            Auth:
              Authorizer: NONE # 認証不要

  # POST /user/me — 大会ID照会（認証必要）
  ConformFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Conform"
      CodeUri: functions/auth/
      Handler: conform.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/me
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /user/me — プロフィール取得（認証必要）
  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Profile"
      CodeUri: functions/auth/
      Handler: profile.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/me
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /user/password — パスワード変更（認証必要）
  ChangePasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-ChangePassword"
      CodeUri: functions/auth/
      Handler: changePassword.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/password
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # ===== Phase 3: コア API =====

  # GET /entries/init — 初期データ取得（認証必要）
  InitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-Init"
      CodeUri: functions/entry/
      Handler: init.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/init
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/auto — 自動入力送信（認証必要）
  AutoCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-AutoCreate"
      CodeUri: functions/pitlog/
      Handler: autoCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/auto
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/hand — 手入力送信（認証必要）
  HandCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-HandCreate"
      CodeUri: functions/pitlog/
      Handler: handCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/hand
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/update — 変更対象ピット記録取得（認証必要）
  UpdateGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-UpdateGet"
      CodeUri: functions/pitlog/
      Handler: updateGet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/update
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # PUT /entries/update — 記録変更/リタイア登録（認証必要）
  UpdatePutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-UpdatePut"
      CodeUri: functions/pitlog/
      Handler: updatePut.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/update
            Method: PUT
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/retire — リタイア情報取得（認証必要）
  RetireGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RetireGet"
      CodeUri: functions/pitlog/
      Handler: retireGet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/retire
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # POST /entries/retire — リタイア登録（認証必要）
  RetireCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-RetireCreate"
      CodeUri: functions/pitlog/
      Handler: retireCreate.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/retire
            Method: POST
            Auth:
              Authorizer: LambdaAuthorizer

  # GET /entries/show — 全ピット情報取得（認証必要）
  ShowAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "OfficialSupportSystem-${Env}-ShowAll"
      CodeUri: functions/pitlog/
      Handler: showAll.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /entries/show
            Method: GET
            Auth:
              Authorizer: LambdaAuthorizer

  # ===== Phase 1: DynamoDB テーブル =====

  # ユーザーテーブル: PK=username
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  # 組織テーブル: PK=circuit（サーキット番号）
  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Organizations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: circuit
          AttributeType: N
      KeySchema:
        - AttributeName: circuit
          KeyType: HASH

  # レーステーブル: PK=id
  RaceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Race"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # エントリーテーブル: PK=race_id, SK=car_num
  EntryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Entry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # スタートドライバーテーブル: PK=race_id, SK=car_num
  StartDriverTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-StartDriver"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # ピット担当割り当てテーブル: PK=race_id, SK=username#maintenance_area（複合キー）
  PitAssignmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitAssignment"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: "username#maintenance_area"
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: maintenance_area
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: "username#maintenance_area"
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
            - AttributeName: maintenance_area
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ピットログテーブル: PK=race_id, SK=id(ULID) / GSI=car_num
  PitLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: CarNumIndex
          KeySchema:
            - AttributeName: car_num
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ピットログ変更履歴テーブル: PK=pit_log_id, SK=id / GSI=modified_by
  PitLogHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-PitLogHistory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pit_log_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: modified_by
          AttributeType: S
        - AttributeName: modified_at
          AttributeType: S
      KeySchema:
        - AttributeName: pit_log_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ModifiedByIndex
          KeySchema:
            - AttributeName: modified_by
              KeyType: HASH
            - AttributeName: modified_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # リタイアテーブル: PK=race_id, SK=car_num
  RetireTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-Retire"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: car_num
          AttributeType: N
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: car_num
          KeyType: RANGE

  # 外回り記録テーブル: PK=race_id, SK=id / GSI=username
  OutpostLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "OfficialSupportSystem-${Env}-OutpostLog"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: race_id
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: race_id
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

# ===== Outputs =====
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Env}/"
  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
